name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install flake8 pytest

      - name: Run flake8
        run: python -m flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest when tests exist
        shell: bash
        run: |
          if find . -path './mobile/node_modules' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest
          else
            echo "No Python tests found; skipping pytest."
          fi
